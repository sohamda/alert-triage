[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alert-triage"
version = "0.1.0"
description = "A small LangGraph service that triages log lines into alerts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "requests==2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alert_triage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
